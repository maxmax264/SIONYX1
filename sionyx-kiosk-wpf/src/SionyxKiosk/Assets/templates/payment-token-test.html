<!DOCTYPE html>
<html dir="rtl" lang="he">
<head>
    <meta charset="UTF-8">
    <title>בדיקת טוקן באייפרם</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex; height: 100vh; overflow: hidden;
        }
        #sidebar {
            width: 300px; flex-shrink: 0; padding: 16px; overflow-y: auto;
            background: #F8FAFC; border-left: 1px solid #E2E8F0;
        }
        #sidebar h3 { font-size: 14px; margin-bottom: 12px; }
        .strategy-btn {
            display: block; width: 100%; padding: 10px; margin-bottom: 8px;
            border: 1px solid #CBD5E1; border-radius: 8px; background: white;
            font-size: 13px; cursor: pointer; text-align: right;
        }
        .strategy-btn:hover { background: #EEF2FF; }
        .strategy-btn:disabled { opacity: 0.5; cursor: default; }
        #result {
            margin-top: 16px; padding: 10px; background: #1E1E1E; color: #D4D4D4;
            font-family: Consolas, monospace; font-size: 12px; border-radius: 8px;
            white-space: pre-wrap; word-break: break-all; min-height: 80px;
        }
        #frameCol { flex: 1; display: flex; flex-direction: column; }
        #status { padding: 8px 16px; font-size: 13px; color: #64748B; }
        iframe { flex: 1; border: none; width: 100%; }
    </style>
</head>
<body>
    <div id="sidebar">
        <h3>PaymentType לניסיון (עם הטוקן השמור, דרך האייפרם עצמו)</h3>

        <div style="margin-bottom:14px; padding:10px; background:#FEF3C7; border-radius:8px; border:1px solid #F59E0B;">
            <label style="font-size:12px; display:block; margin-bottom:4px;">תוקף אמיתי של הכרטיס (MMYY, אופציונלי):</label>
            <input type="text" id="tokefInput" placeholder="1229" maxlength="4"
                   style="width:100%; padding:8px; border:1px solid #CBD5E1; border-radius:6px; font-size:13px; box-sizing:border-box;" />
        </div>

        <div style="margin-bottom:14px; padding:10px; background:#FEF3C7; border-radius:8px; border:1px solid #F59E0B;">
            <input type="text" id="customPaymentType" placeholder="הקלד PaymentType משלך..."
                   style="width:100%; padding:8px; margin-bottom:6px; border:1px solid #CBD5E1; border-radius:6px; font-size:13px; box-sizing:border-box;" />
            <button class="strategy-btn" style="background:#F59E0B; color:white; border:none; margin:0;"
                    onclick="tryCustomPaymentType()">נסה ערך מותאם אישית</button>
        </div>

        <button class="strategy-btn" onclick="tryPaymentType('Ragil')">Ragil (התשלום הרגיל שכן עובד)</button>
        <button class="strategy-btn" onclick="tryPaymentType('TashlumBodedNew')">TashlumBodedNew</button>
        <button class="strategy-btn" onclick="tryPaymentType('ChargeToken')">ChargeToken</button>
        <button class="strategy-btn" onclick="tryPaymentType('TokenCharge')">TokenCharge</button>
        <button class="strategy-btn" onclick="tryPaymentType('Token')">Token</button>
        <button class="strategy-btn" onclick="tryPaymentType('Keva')">Keva</button>
        <button class="strategy-btn" onclick="tryPaymentType('HK')">HK (הוראת קבע - כבר ידוע: מזוהה, דורש כרטיס מלא)</button>
        <button class="strategy-btn" onclick="tryPaymentType('TashlumKeva')">TashlumKeva</button>
        <button class="strategy-btn" onclick="tryPaymentType('ChargeKeva')">ChargeKeva</button>
        <button class="strategy-btn" onclick="tryPaymentType('KevaTashlum')">KevaTashlum</button>
        <button class="strategy-btn" onclick="tryPaymentType('Bodded')">Bodded</button>
        <button class="strategy-btn" onclick="tryPaymentType('TashlumBoded')">TashlumBoded</button>
        <button class="strategy-btn" onclick="tryPaymentType('Immediate')">Immediate</button>
        <button class="strategy-btn" onclick="tryPaymentType('Manual')">Manual</button>
        <button class="strategy-btn" onclick="tryPaymentType('Regular')">Regular</button>
        <button class="strategy-btn" onclick="tryPaymentType('SavedCard')">SavedCard</button>
        <button class="strategy-btn" onclick="tryPaymentType('PayWithToken')">PayWithToken</button>
        <button class="strategy-btn" onclick="tryPaymentType('ExistingToken')">ExistingToken</button>
        <button class="strategy-btn" onclick="tryPaymentType('Recurring')">Recurring</button>
        <button class="strategy-btn" onclick="tryPaymentType('UseToken')">UseToken</button>
        <div id="result">טרם נשלחה בקשה.</div>
    </div>
    <div id="frameCol">
        <div id="status">טוען אייפרם...</div>
        <iframe id="NedarimFrame"></iframe>
    </div>

    <script>
        var CONFIG = null;
        var lastTriedPaymentType = null;

        window.chrome.webview.addEventListener('message', function(event) {
            var msg = event.data;
            if (msg.action === 'setConfig') {
                setConfig(msg.config);
            }
        });

        window.addEventListener("message", handlePostMessage, false);

        function setConfig(config) {
            CONFIG = config;
            document.getElementById('status').textContent =
                'מוסד: ' + config.mosadId + ' | טוקן: ' + (config.kevaId ? config.kevaId.slice(0,4) + '***' : '(אין)');
            var url = "https://matara.pro/nedarimplus/iframe?language=he&CVV=Hide&Tokef=Hide";
            document.getElementById('NedarimFrame').src = url;
        }

        function postToNedarim(data) {
            var iframe = document.getElementById('NedarimFrame');
            if (iframe && iframe.contentWindow) iframe.contentWindow.postMessage(data, "*");
        }

        function handlePostMessage(event) {
            if (!event.data || !event.data.Name) return;
            switch (event.data.Name) {
                case 'Height':
                    document.getElementById('status').textContent = 'אייפרם מוכן.';
                    break;
                case 'TransactionResponse':
                    showResult(event.data.Value, event.origin);
                    break;
            }
        }

        function tryCustomPaymentType() {
            var val = document.getElementById('customPaymentType').value.trim();
            if (!val) { showResult({Error: 'לא הוקלד ערך'}, ''); return; }
            tryPaymentType(val);
        }

        function tryPaymentType(paymentType) {
            if (!CONFIG) { showResult({Error: 'CONFIG לא הוגדר עדיין'}, ''); return; }
            lastTriedPaymentType = paymentType;
            var tokefVal = document.getElementById('tokefInput').value.trim();
            document.getElementById('result').textContent = 'שולח PaymentType=' + paymentType +
                (tokefVal ? ' עם תוקף=' + tokefVal : '') + '...';
            window.chrome.webview.postMessage({
                action: 'debugLog',
                message: '[TokenTest] Trying PaymentType=' + paymentType
            });
            postToNedarim({
                'Name': 'FinishTransaction2',
                'Value': {
                    'Mosad': CONFIG.mosadId,
                    'MosadId': CONFIG.mosadId,
                    'ApiValid': CONFIG.saveCardApiValid,
                    'PaymentType': paymentType,
                    'Token': CONFIG.kevaId,
                    'KevaId': CONFIG.kevaId,
                    'Tokef': tokefVal,
                    'TransactionId': 'SIONYX-' + Date.now(),
                    'Zihuy': 'SIONYX-' + Date.now(),
                    'Currency': '1',
                    'Zeout': '',
                    'FirstName': CONFIG.userFirstName || '',
                    'LastName': CONFIG.userLastName || '',
                    'Street': '', 'City': '',
                    'Phone': CONFIG.userPhone || '',
                    'Mail': '', 'Amount': CONFIG.amount || '1',
                    'Tashlumim': '1', 'Groupe': '',
                    'Comment': 'SIONYX-iframe-token-test',
                    'CallBack': CONFIG.callbackUrl || ''
                }
            });
        }

        function showResult(value, origin) {
            var text = 'PaymentType שנוסה: ' + (lastTriedPaymentType || '(לא ידוע)') + '\n' +
                       'מקור (origin): ' + origin + '\n\n' + JSON.stringify(value, null, 2);
            document.getElementById('result').textContent = text;
            window.chrome.webview.postMessage({
                action: 'debugLog',
                message: '[TokenTest] PaymentType=' + lastTriedPaymentType + ' response from origin=' + origin + ': ' + JSON.stringify(value)
            });
        }
    </script>
</body>
</html>
